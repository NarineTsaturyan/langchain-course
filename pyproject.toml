[project]
name = "langchain-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "narine-tsaturyan_mars", email = "narine.tsaturyan@effem.com" }
]
requires-python = ">=3.9"
dependencies = [
    "black>=25.11.0",
    "isort>=6.1.0",
    "langchain>=0.3.30",
    "langchain-ollama>=0.3.10",
    "langchain-openai>=0.3.35",
    "ollama>=0.6.3",
    "python-dotenv>=1.2.1",
    "urllib3<2.0.0",
]

[project.scripts]
langchain-course = "langchain_course:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
